[project]
name = "pyreinfolib"
description = "Python client for Real Estate Information Library APIs"
authors = [
    { name = "matsudan", email = "daaamatsun@gmail.com" }
]
dynamic = ["version"]
dependencies = [
    "requests",
    # `urllib3.util.Retry` is used directly to configure the client's retry policy. It
    # arrives with requests either way, but declaring what is imported keeps the resolver
    # honest. `requests.adapters.Retry` is the same object, but it is an incidental import
    # in requests rather than part of its public API.
    "urllib3>=1.26",
]
readme = "README.md"
requires-python = ">= 3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = ["real-estate", "api", "client"]

[project.urls]
Homepage = "https://github.com/matsudan/pyreinfolib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pyreinfolib"]

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.hatch.version]
path = "pyreinfolib/__init__.py"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.3.0",
    "responses>=0.25.8",
    "ruff>=0.12.12",
    # Pinned exactly, unlike the others. ty is pre-1.0 and its own documentation states that
    # breaking changes, diagnostics included, can land between any two 0.0.x releases. A lower
    # bound would let a patch update turn CI red without a change to this repository.
    # Dependabot proposes the bump; the diff gets read at that point.
    "ty==0.0.65",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "Q", "UP", "RUF", "S"]
ignore = [
    # Full-width punctuation is intentional in the Japanese comments and docstrings.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# pytest rewrites plain asserts, so S101 is not actionable in tests.
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-v --cov=pyreinfolib --cov-branch"

[tool.ty.environment]
# The floor this package supports. Without it ty checks against whichever interpreter it
# happens to run under, which would hide a 3.11 problem when run on 3.12.
python-version = "3.11"
