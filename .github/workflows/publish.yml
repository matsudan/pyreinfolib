name: Publish Python distribution to PyPI

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (tag/branch/SHA) to build from. Defaults to the ref that triggered the run."
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/SHA) to build from. Defaults to the ref that triggered the run."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # NOTE: When this workflow is called from release-please.yml, the `github`
      # context belongs to the caller (a push to main), so the tag created by
      # release-please must be passed in explicitly via `inputs.ref`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # `hatch build` executes build-backend code from the checked-out tree.
          # Do not leave the GITHUB_TOKEN in .git/config where it could read it.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade 'pip==26.1.2'
          pip install 'hatch==1.17.1'

      - name: Build package
        run: hatch build

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish distribution 📦 to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyreinfolib
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
