version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
    # .github/workflows/pr-title.yml requires a Conventional Commits title.
    commit-message:
      prefix: "build"
      include: "scope"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
